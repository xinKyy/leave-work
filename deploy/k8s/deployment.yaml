apiVersion: apps/v1
kind: Deployment
metadata:
  name: leave-work
  labels:
    app: leave-work
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leave-work
  template:
    metadata:
      labels:
        app: leave-work
    spec:
      containers:
        - name: leave-work
          image: ghcr.io/xinkyy/leave-work:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: leave-work
  labels:
    app: leave-work
spec:
  type: LoadBalancer
  selector:
    app: leave-work
  ports:
    - name: http
      port: 80
      targetPort: http
